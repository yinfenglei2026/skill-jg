spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI}

management:
  endpoint:
    health:
      probes:
        enabled: true

governance:
  portal:
    allowed-origin: ${PORTAL_ALLOWED_ORIGIN:http://localhost:5173}
  artifact-verification:
    allowed-registry: ${HARBOR_REGISTRY:}
    username: ${HARBOR_USERNAME:}
    password: ${HARBOR_PASSWORD:}
    registry-ca-cert: ${HARBOR_CA_CERT:}
    cosign-executable: ${COSIGN_EXECUTABLE:}
    cosign-public-key: ${COSIGN_PUBLIC_KEY:}
    allowed-builder-ids: ${SLSA_ALLOWED_BUILDER_IDS:}
