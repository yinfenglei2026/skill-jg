name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: azure/setup-kubectl@v4
      - name: Verify control plane
        run: ./mvnw -B -pl apps/control-plane verify
      - name: Verify portal view model
        working-directory: apps/portal
        run: |
          npm ci
          npm test
      - name: Render Kubernetes manifests
        run: kubectl kustomize infra/k8s/base > /dev/null
      - name: Validate local dependency declarations
        env:
          POSTGRES_ADMIN_USERNAME: verify-admin
          POSTGRES_ADMIN_PASSWORD: verify-admin-password
          GOVERNANCE_DB_USERNAME: verify-governance
          GOVERNANCE_DB_PASSWORD: verify-governance-password
          KEYCLOAK_DB_USERNAME: verify-keycloak
          KEYCLOAK_DB_PASSWORD: verify-keycloak-password
          KEYCLOAK_ADMIN_USERNAME: verify-admin
          KEYCLOAK_ADMIN_PASSWORD: verify-keycloak-admin-password
        run: |
          docker compose config > /dev/null
          jq empty infra/local/keycloak/realm-governance.json
